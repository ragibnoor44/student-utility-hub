<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Navbar Page -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
      <a class="navbar-brand" href="index.html">StudentHub</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">Notes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tasks.html">Tasks</a>
          </li>
          <li class="nav-item ms-2">
            <button id="themeToggle" class="theme-btn">🌙</button>
          </li>
        </ul>
      </div>
    </nav>

    <!-- DashBorad Section -->
    <section class="container py-5">
        <h1 class="mb-4">My Notes</h1>

        <form id="noteForm" class="mb-4">
            <div class="mb-3">
                <input type="text" id="noteTitle" class="form-control" placeholder="Note title" required>
            </div>
            <div class="mb-3">
                <textarea id="noteText" class="form-control" rows="3" placeholder="Write your Notes..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Notes</button>
        </form>

        <div id="notesContainer" class="row g-3"></div>
    </section>

    <!-- Footer Section  -->
     <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Ragibnoor</p>
     </footer>
    
    <!-- Script tag link -->
    <script src=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
